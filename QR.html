<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lo</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f0f0f0; /* 背景が分かりやすいように任意で設定 */
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* 3D空間の奥行きを自然にするため追加 */
        }

        .loading-15 {
            position: relative;
            width: 48px;
            height: 48px;
            transform-style: preserve-3d;
            animation: animation-loading-15 3s infinite linear;
        }

        .loading-15 span {
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 48px;
            border: 1px solid #2589d0;
            background-color: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
        }

        .loading-15 span:nth-of-type(1) {
            transform: translateZ(24px);
        }

        .loading-15 span:nth-of-type(2) {
            transform: rotateY(180deg) translateZ(24px);
        }

        .loading-15 span:nth-of-type(3) {
            transform: rotateY(-90deg) translateZ(24px);
        }

        .loading-15 span:nth-of-type(4) {
            transform: rotateY(90deg) translateZ(24px);
        }

        .loading-15 span:nth-of-type(5) {
            transform: rotateX(-90deg) translateZ(24px);
        }

        .loading-15 span:nth-of-type(6) {
            transform: rotateX(90deg) translateZ(24px);
        }

        @keyframes animation-loading-15 {
            0% {
                transform: rotateY(0deg) rotateZ(0deg);
            }
            20% {
                transform: rotateY(90deg) rotateZ(0deg);
            }
            40% {
                transform: rotateX(45deg) rotateZ(45deg);
            }
            60% {
                transform: rotateX(90deg) rotateY(180deg) rotateX(90deg);
            }
            80% {
                transform: rotateX(310deg) rotateZ(230deg);
            }
            100% {
                transform: rotateX(360deg) rotateZ(360deg);
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="loading-15">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </main>
</body>
</html>
