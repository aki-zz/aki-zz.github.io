<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR</title>
</head>
<body>
    <main>
        <style>
            body {
                padding: 0;
                margin: 0;
            }
            main {
                background-color: aqua;
                padding-block-end: 100em;
                text-align: center;
            }
            main img {
                padding: 50px;
                border-radius: 20px;
                background-color: lightsteelblue;
            }
            br {
                -ms-high-contrast-adjust: initial;
                -webkit-margin-top-collapse: separate;
                -ms-progress-appearance: unset;
                height: 50px;
            }
            #label-center p {
                color: snow;
                font-size: 20px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            }
            
        </style>
        <br>
        <img src="qrtool.jpeg">
        <div id="label-center">
            <label for="img">
                <p>髙木家のホームページ ホーム</p>
            </label>
            <br>
            <p>髙木家のホームページを、</p>
        </div>
    </main>
</body>
</html>
