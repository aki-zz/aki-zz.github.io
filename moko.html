<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>もこ族</title>
    <link rel="stylesheet" href="nagai-moko.jpg">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            width: 100vw;
            height: 100vh;
        }

        #dog-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .moko, .mokocha, .mokomaru, .mokokokomokoko, .mokko, .moko2, .mamimumemoko {
            position: absolute;
            width: 300px;
            height: 100px;
            background-image: url('nagai-moko.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            image-rendering: pixelated;
            transform-origin: center center;
            filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.2));
            opacity: 0.95;
            will-change: transform;
        }
    </style>
</head>
<body>
    <div id="dog-container">
        <div class="moko"></div>
        <div class="mokocha"></div>
        <div class="mokomaru"></div>
        <div class="mokokokomokoko"></div>
        <div class="mokko"></div>
        <div class="moko2"></div>
        <div class="mamimumemoko"></div>
    </div>
    <script>
        const mokos = document.querySelectorAll('.moko, .mokocha, .mokomaru, .mokokokomokoko, .mokko, .moko2, .mamimumemoko');
        const container = document.getElementById('dog-container');
        const MOKO_WIDTH = 300;
        const MOKO_HEIGHT = 100;
        let mokoStates = [];

        mokos.forEach((moko) => {
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            let initialX = Math.random() * (containerWidth - MOKO_WIDTH);
            let initialY = Math.random() * (containerHeight - MOKO_HEIGHT);
            let angle = Math.random() * 360;
            let speed = Math.random() * 4 + 3;
            let rotationSpeed = (Math.random() - 0.5) * 8;
            let vx = Math.cos(angle * Math.PI / 180) * speed;
            let vy = Math.sin(angle * Math.PI / 180) * speed;

            mokoStates.push({
                element: moko,
                x: initialX,
                y: initialY,
                vx: vx,
                vy: vy,
                angle: angle,
                rotationSpeed: rotationSpeed,
                width: MOKO_WIDTH,
                height: MOKO_HEIGHT
            });
        });

        function animate() {
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            mokoStates.forEach(state => {
                state.x += state.vx;
                state.y += state.vy;
                state.angle += state.rotationSpeed;
                state.angle %= 360;

                if (state.x <= 0 || state.x >= containerWidth - state.width) {
                    state.vx *= -1;
                    state.rotationSpeed *= -1.1;
                }
                if (state.y <= 0 || state.y >= containerHeight - state.height) {
                    state.vy *= -1;
                    state.rotationSpeed *= -1.1;
                }

                state.vx += (Math.random() - 0.5) * 0.4;
                state.vy += (Math.random() - 0.5) * 0.4;
                
                const currentSpeed = Math.sqrt(state.vx * state.vx + state.vy * state.vy);
                if (currentSpeed > 12) { state.vx *= 0.94; state.vy *= 0.94; }
                else if (currentSpeed < 3) { state.vx *= 1.06; state.vy *= 1.06; }

                state.element.style.transform = `translate3d(${state.x}px, ${state.y}px, 0) rotate(${state.angle}deg)`;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>

</html>
